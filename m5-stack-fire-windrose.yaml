substitutions:
  sample_capacity: "2542"
  wind_direction_entity: sensor.estacion_direccion_del_viento
  wind_speed_entity: sensor.estacion_velocidad_del_viento
  temperature_entity: sensor.estacion_temperatura_exterior
  humidity_entity: sensor.estacion_humedad_exterior
  apparent_temperature_entity: sensor.estacion_temperatura_aparente
  solar_radiation_entity: sensor.estacion_radiacion_solar
  uv_index_entity: sensor.estacion_indice_uv
  solar_radiation_max_entity: sensor.estacion_maxima_radiacion_solar
  wind_gust_entity: sensor.estacion_racha_de_viento
  cloud_base_entity: sensor.estacion_techo_de_nubes
  barometer_entity: sensor.estacion_barometro_mbar
  rain_rate_entity: sensor.estacion_tasa_de_lluvia_por_hora
  rain_last_hour_entity: sensor.estacion_lluvia_ultima_hora
  rain_24h_entity: sensor.estacion_lluvia_24h
  rain_total_entity: sensor.estacion_lluvia_total
  sunrise_entity: sensor.sun_next_rising
  sunset_entity: sensor.sun_next_setting

esphome:
  name: m5-stack-fire
  friendly_name: M5Stack Fire
  area: Estudio

esp32:
  board: m5stack-fire
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true
  cpu_frequency: 240MHZ
  variant: ESP32
  flash_mode: qio
  flash_frequency: 80MHZ
  flash_size: 16MB

psram:
  mode: quad
  speed: 80MHz

logger:
  level: WARN

api:
  encryption:
    key: !secret m5_stack_fire__encryption_key
  on_client_connected:
    then:
      - lambda: |-
          id(ha_api_connected) = true;

  on_client_disconnected:
    then:
      - lambda: |-
          id(ha_api_connected) = false;
          id(ha_api_disconnects)++;

ota:
  - platform: esphome
  - platform: http_request
    id: ota_http_request_1
  - platform: web_server

web_server:
  version: 3
  include_internal: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_btm: true

runtime_stats:
  log_interval: 60s

http_request:
  
output:

  - platform: ledc
    pin: GPIO32
    id: backlight

light:

  - platform: monochromatic
    id: display_backlight
    internal: true
    output: backlight
    restore_mode: ALWAYS_ON

spi:
      clk_pin: GPIO18
      mosi_pin: GPIO23
    
font:

  - file:
      type: gfonts
      family: Open+Sans
      weight: 500
    id: font_title
    size: 20
    bpp: 4

  - file:
      type: gfonts
      family: Open+Sans
      weight: 500
    id: font_value
    size: 28
    bpp: 4

  - file:
      type: gfonts
      family: Open+Sans
      weight: 500
    id: font_small
    size: 16
    bpp: 4
  
time:
  
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_backlight
    on_time:
      - hours: 23
        minutes: 30
        seconds: 0
        then:
          - script.execute: update_backlight
      - hours: 7
        minutes: 30
        seconds: 0
        then:
          - script.execute: update_backlight

globals:

  - id: ha_api_connected
    type: bool
    restore_value: false
    initial_value: "false"

  - id: ha_api_disconnects
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_wind_direction
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: last_wind_speed
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: have_wind_data
    type: bool
    restore_value: false
    initial_value: "false"

  - id: first_wind_epoch
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: last_wind_epoch
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: sample_count
    type: int
    restore_value: false
    initial_value: "0"

  - id: sample_pos
    type: int
    restore_value: false
    initial_value: "0"

  - id: sample_sector
    type: uint8_t[${sample_capacity}]
    restore_value: false

  - id: sample_bft
    type: uint8_t[${sample_capacity}]
    restore_value: false

  - id: sample_ts
    type: uint32_t[${sample_capacity}]
    restore_value: false

  - id: sector_count
    type: uint16_t[16]
    restore_value: false

  - id: sector_bft_count
    type: uint16_t[16][13]
    restore_value: false

  - id: calm_count
    type: uint16_t
    restore_value: false
    initial_value: "0"

  - id: active_screen
    type: uint8_t
    restore_value: false
    initial_value: "0"

  - id: climate_sample_count
    type: int
    restore_value: false
    initial_value: "0"

  - id: climate_sample_pos
    type: int
    restore_value: false
    initial_value: "0"

  - id: climate_temperature
    type: float[${sample_capacity}]
    restore_value: false

  - id: climate_humidity
    type: float[${sample_capacity}]
    restore_value: false

sensor:

  - platform: homeassistant
    id: wind_direction
    entity_id: ${wind_direction_entity}
    internal: true

    on_value:
      then:
        - lambda: |-
            if (isnan(x))
              return;

            float dir = x;

            while (dir < 0.0f)
              dir += 360.0f;

            while (dir >= 360.0f)
              dir -= 360.0f;

            id(last_wind_direction) = dir;
            id(have_wind_data) = true;

        - component.update: m5_display

  - platform: homeassistant
    id: wind_speed
    entity_id: ${wind_speed_entity}
    internal: true

    on_value:
      then:
        - lambda: |-
            if (isnan(x))
              return;

            id(last_wind_speed) = x;
            id(have_wind_data) = true;

            auto current_time =
              id(ha_time).now();

            if (current_time.is_valid())
              id(last_wind_epoch) =
                current_time.timestamp;

  - platform: homeassistant
    id: wind_gust
    entity_id: ${wind_gust_entity}
    internal: true

  - platform: homeassistant
    id: cloud_base
    entity_id: ${cloud_base_entity}
    internal: true

  - platform: homeassistant
    id: barometer
    entity_id: ${barometer_entity}
    internal: true

  - platform: homeassistant
    id: temperature
    entity_id: ${temperature_entity}
    internal: true

    on_value:
      then:
        - component.update: m5_display

  - platform: homeassistant
    id: humidity
    entity_id: ${humidity_entity}
    internal: true

  - platform: homeassistant
    id: apparent_temperature
    entity_id: ${apparent_temperature_entity}
    internal: true

  - platform: homeassistant
    id: solar_radiation
    entity_id: ${solar_radiation_entity}
    internal: true

  - platform: homeassistant
    id: uv_index
    entity_id: ${uv_index_entity}
    internal: true

  - platform: homeassistant
    id: solar_radiation_max
    entity_id: ${solar_radiation_max_entity}
    internal: true

  - platform: homeassistant
    id: rain_rate
    entity_id: ${rain_rate_entity}
    internal: true

    on_value:
      then:
        - component.update: m5_display

  - platform: homeassistant
    id: rain_last_hour
    entity_id: ${rain_last_hour_entity}
    internal: true

  - platform: homeassistant
    id: rain_24h
    entity_id: ${rain_24h_entity}
    internal: true

  - platform: homeassistant
    id: rain_total
    entity_id: ${rain_total_entity}
    internal: true

  - platform: wifi_signal
    id: wifi_db
    internal: true
    update_interval: 17s

  - platform: uptime
    id: uptime_sensor
    internal: true
    update_interval: 17s

text_sensor:

  - platform: homeassistant
    id: sunrise
    entity_id: ${sunrise_entity}
    internal: true

  - platform: homeassistant
    id: sunset
    entity_id: ${sunset_entity}
    internal: true

interval:

  - interval: 17s
    then:
      - lambda: |-

          if (!id(ha_api_connected))
            return;

          if (isnan(id(wind_direction).state) ||
              isnan(id(wind_speed).state))
            return;

          // ---------------------------------------------------------
          // Dirección
          // ---------------------------------------------------------

          float dir = id(wind_direction).state;

          while (dir < 0.0f)
            dir += 360.0f;

          while (dir >= 360.0f)
            dir -= 360.0f;

          float knots = id(wind_speed).state;

          // ---------------------------------------------------------
          // Última lectura válida
          // ---------------------------------------------------------

          id(last_wind_direction) = dir;
          id(last_wind_speed) = knots;
          id(have_wind_data) = true;

          // ---------------------------------------------------------
          // Beaufort
          // ---------------------------------------------------------

          int bft = 0;

          if (knots < 1.0f) bft = 0;
          else if (knots < 4.0f) bft = 1;
          else if (knots < 7.0f) bft = 2;
          else if (knots < 11.0f) bft = 3;
          else if (knots < 17.0f) bft = 4;
          else if (knots < 22.0f) bft = 5;
          else if (knots < 28.0f) bft = 6;
          else if (knots < 34.0f) bft = 7;
          else if (knots < 41.0f) bft = 8;
          else if (knots < 48.0f) bft = 9;
          else if (knots < 56.0f) bft = 10;
          else if (knots < 64.0f) bft = 11;
          else bft = 12;

          // ---------------------------------------------------------
          // Sector de 22.5 grados
          // ---------------------------------------------------------

          int sector =
            int((dir + 11.25f) / 22.5f) % 16;

          // ---------------------------------------------------------
          // Timestamp de la muestra
          // ---------------------------------------------------------

          auto current_time = id(ha_time).now();

          uint32_t epoch = 0;

          if (current_time.is_valid())
            epoch = current_time.timestamp;

          // ---------------------------------------------------------
          // POSICIÓN ACTUAL DEL BUFFER
          //
          // Si el buffer está lleno, esta posición contiene la
          // muestra más antigua y será sustituida.
          // ---------------------------------------------------------

          int pos = id(sample_pos);

          // ---------------------------------------------------------
          // Si el buffer está lleno:
          // eliminar de los contadores la muestra que vamos a
          // sustituir.
          // ---------------------------------------------------------

          if (id(sample_count) >= ${sample_capacity}) {

            int old_sector =
              id(sample_sector)[pos];

            int old_bft =
              id(sample_bft)[pos];

            if (id(sector_count)[old_sector] > 0)
              id(sector_count)[old_sector]--;

            if (id(sector_bft_count)[old_sector][old_bft] > 0)
              id(sector_bft_count)[old_sector][old_bft]--;

            if (old_bft == 0 &&
                id(calm_count) > 0)
              id(calm_count)--;
          }

          // ---------------------------------------------------------
          // Si todavía no está lleno, aumentar número de muestras.
          // ---------------------------------------------------------

          if (id(sample_count) < ${sample_capacity})
            id(sample_count)++;

          // ---------------------------------------------------------
          // Guardar nueva muestra
          // ---------------------------------------------------------

          id(sample_sector)[pos] = sector;
          id(sample_bft)[pos] = bft;
          id(sample_ts)[pos] = epoch;

          // ---------------------------------------------------------
          // Contadores
          // ---------------------------------------------------------

          id(sector_count)[sector]++;
          id(sector_bft_count)[sector][bft]++;

          if (bft == 0)
            id(calm_count)++;

          // ---------------------------------------------------------
          // Avanzar posición del buffer circular.
          //
          // Si estaba lleno, ahora apunta a la nueva muestra más
          // antigua del buffer.
          // ---------------------------------------------------------

          id(sample_pos) =
            (pos + 1) % ${sample_capacity};

          // ---------------------------------------------------------
          // ACTUALIZAR INICIO DEL PERIODO
          //
          // Mientras el buffer no esté lleno, la primera muestra
          // está en la posición 0.
          //
          // Cuando está lleno, sample_pos apunta a la muestra más
          // antigua.
          // ---------------------------------------------------------

          if (id(sample_count) < ${sample_capacity}) {

            id(first_wind_epoch) =
              id(sample_ts)[0];

          } else {

            id(first_wind_epoch) =
              id(sample_ts)[id(sample_pos)];
          }

          if (!id(ha_api_connected) ||
              isnan(id(temperature).state) ||
              isnan(id(humidity).state))
            return;

          int climate_pos = id(climate_sample_pos);

          id(climate_temperature)[climate_pos] =
            id(temperature).state;
          id(climate_humidity)[climate_pos] =
            id(humidity).state;

          if (id(climate_sample_count) <
              ${sample_capacity})
            id(climate_sample_count)++;

          id(climate_sample_pos) =
            (climate_pos + 1) % ${sample_capacity};

binary_sensor:

  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: GPIO39
      inverted: true

    on_press:
      then:
        - lambda: |-
            id(active_screen) = 2;
        - component.update: m5_display

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: GPIO38
      inverted: true

    on_press:
      then:
        - lambda: |-
            id(active_screen) = 1;
        - component.update: m5_display

  - platform: gpio
    id: button_c
    name: "Button C"
    pin:
      number: GPIO37
      inverted: true

    on_press:
      then:
        - lambda: |-
            id(active_screen) = 0;
        - component.update: m5_display

script:

  - id: update_backlight
    mode: restart
    then:
      - if:
          condition:
            lambda: |-
              auto now = id(ha_time).now();
              if (!now.is_valid())
                return false;

              const int minutes =
                now.hour * 60 + now.minute;

              return minutes >= 23 * 60 + 30 ||
                minutes < 7 * 60 + 30;
          then:
            - light.turn_on:
                id: display_backlight
                brightness: 25%
          else:
            - light.turn_on:
                id: display_backlight
                brightness: 100%

display:

  - platform: mipi_spi
    id: m5_display
    model: M5CORE
    cs_pin: GPIO14
    dc_pin: GPIO27
    reset_pin: GPIO33
    data_rate: 40MHz
    invert_colors: true
    auto_clear_enabled: true
    buffer_size: 100%
    update_interval: never
    use_axis_flips: false
    rotation: "180"

    lambda: |-

      // ============================================================
      // COLORES
      // ============================================================

      const auto bg =
        Color(255, 255, 255);

      const auto text =
        Color(20, 20, 20);

      const auto grid =
        Color(205, 205, 205);

      const auto radial =
        Color(228, 228, 228);

      const auto muted =
        Color(95, 95, 95);

      const auto blue =
        Color(45, 65, 220);

      const auto red =
        Color(255, 0, 0);

      auto print_diagnostics = [&]() {
        uint32_t uptime_seconds =
          isnan(id(uptime_sensor).state)
            ? 0
            : static_cast<uint32_t>(
                id(uptime_sensor).state
              );
        const uint32_t days =
          uptime_seconds / 86400;
        uptime_seconds %= 86400;
        const uint32_t hours =
          uptime_seconds / 3600;
        uptime_seconds %= 3600;
        const uint32_t minutes =
          uptime_seconds / 60;
        const uint32_t seconds =
          uptime_seconds % 60;

        it.printf(
          8,
          218,
          id(font_small),
          muted,
          "WiFi %.0f",
          id(wifi_db).state
        );
        it.printf(
          94,
          218,
          id(font_small),
          muted,
          "D:%lu",
          static_cast<unsigned long>(
            id(ha_api_disconnects)
          )
        );
        it.printf(
          144,
          218,
          id(font_small),
          muted,
          "Up %lud %02lu:%02lu:%02lu",
          static_cast<unsigned long>(days),
          static_cast<unsigned long>(hours),
          static_cast<unsigned long>(minutes),
          static_cast<unsigned long>(seconds)
        );
      };

      // ============================================================
      // CLIMATE SCREEN
      // ============================================================

      if (id(active_screen) == 1) {

        const auto temperature_color =
          Color(235, 120, 25);
        const auto humidity_color =
          Color(35, 130, 220);

        it.fill(bg);

        it.print(
          20, 4,
          id(font_small),
          muted,
          "Temperature"
        );

        if (isnan(id(temperature).state)) {
          it.print(
            20, 20,
            id(font_value),
            text,
            "--"
          );
        } else {
          it.printf(
            20, 20,
            id(font_value),
            temperature_color,
            "%.1f C",
            id(temperature).state
          );
        }

        it.print(
          184, 4,
          id(font_small),
          muted,
          "Humidity"
        );

        if (isnan(id(humidity).state)) {
          it.print(
            184, 20,
            id(font_value),
            text,
            "--"
          );
        } else {
          it.printf(
            184, 20,
            id(font_value),
            humidity_color,
            "%.0f%%",
            id(humidity).state
          );
        }

        it.print(
          20, 50,
          id(font_small),
          muted,
          "Apparent"
        );
        if (isnan(id(apparent_temperature).state)) {
          it.print(
            20, 67,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            20, 67,
            id(font_title),
            text,
            "%.1f C",
            id(apparent_temperature).state
          );
        }

        it.print(
          172, 50,
          id(font_small),
          muted,
          "Solar radiation"
        );
        if (isnan(id(solar_radiation).state)) {
          it.print(
            172, 67,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            172, 67,
            id(font_title),
            text,
            "%.0f W/m2",
            id(solar_radiation).state
          );
        }

        it.print(
          20, 89,
          id(font_small),
          muted,
          "UV index"
        );
        if (isnan(id(uv_index).state)) {
          it.print(
            20, 104,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            20, 104,
            id(font_title),
            text,
            "%.1f",
            id(uv_index).state
          );
        }

        it.print(
          172, 89,
          id(font_small),
          muted,
          "Max solar"
        );
        if (isnan(id(solar_radiation_max).state)) {
          it.print(
            172, 104,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            172, 104,
            id(font_title),
            text,
            "%.0f W/m2",
            id(solar_radiation_max).state
          );
        }

        const int graph_x = 12;
        const int graph_y = 140;
        const int graph_width = 296;
        const int graph_height = 60;
        const int climate_count =
          id(climate_sample_count);

        it.rectangle(
          graph_x,
          graph_y,
          graph_width,
          graph_height,
          grid
        );

        it.print(
          160,
          graph_y - 14,
          id(font_small),
          muted,
          TextAlign::TOP_CENTER,
          "12 h"
        );

        for (int i = 1; i < 4; i++) {
          int y =
            graph_y + (graph_height * i) / 4;

          it.line(
            graph_x,
            y,
            graph_x + graph_width,
            y,
            radial
          );
        }

        if (climate_count > 0) {
          const int climate_start =
            climate_count >= ${sample_capacity}
              ? id(climate_sample_pos)
              : 0;

          float minimum_temperature =
            id(climate_temperature)[climate_start];
          float maximum_temperature =
            minimum_temperature;

          for (int i = 1; i < climate_count; i++) {
            int index =
              (climate_start + i) %
              ${sample_capacity};
            float sample_temperature =
              id(climate_temperature)[index];

            if (sample_temperature < minimum_temperature)
              minimum_temperature = sample_temperature;
            if (sample_temperature > maximum_temperature)
              maximum_temperature = sample_temperature;
          }

          if (maximum_temperature -
              minimum_temperature < 4.0f) {
            float middle =
              (maximum_temperature +
               minimum_temperature) / 2.0f;
            minimum_temperature = middle - 2.0f;
            maximum_temperature = middle + 2.0f;
          } else {
            minimum_temperature -= 1.0f;
            maximum_temperature += 1.0f;
          }

          it.printf(
            graph_x,
            graph_y - 14,
            id(font_small),
            muted,
            "%.1f C",
            maximum_temperature
          );

          it.print(
            graph_x + graph_width,
            graph_y - 14,
            id(font_small),
            muted,
            TextAlign::TOP_RIGHT,
            "100%"
          );

          it.printf(
            graph_x,
            graph_y + graph_height + 2,
            id(font_small),
            muted,
            "%.1f C",
            minimum_temperature
          );

          it.print(
            graph_x + graph_width,
            graph_y + graph_height + 2,
            id(font_small),
            muted,
            TextAlign::TOP_RIGHT,
            "0%"
          );

          for (int i = 1; i < climate_count; i++) {
            int previous_index =
              (climate_start + i - 1) %
              ${sample_capacity};
            int current_index =
              (climate_start + i) %
              ${sample_capacity};

            float previous_temperature =
              id(climate_temperature)[previous_index];
            float current_temperature =
              id(climate_temperature)[current_index];
            float previous_humidity =
              id(climate_humidity)[previous_index];
            float current_humidity =
              id(climate_humidity)[current_index];

            int x1 =
              graph_x + ((i - 1) * graph_width) /
              (climate_count - 1);
            int x2 =
              graph_x + (i * graph_width) /
              (climate_count - 1);
            int temperature_y1 =
              graph_y + graph_height - lroundf(
                (previous_temperature -
                 minimum_temperature) * graph_height /
                (maximum_temperature -
                 minimum_temperature)
              );
            int temperature_y2 =
              graph_y + graph_height - lroundf(
                (current_temperature -
                 minimum_temperature) * graph_height /
                (maximum_temperature -
                 minimum_temperature)
              );
            int humidity_y1 =
              graph_y + graph_height - lroundf(
                previous_humidity * graph_height / 100.0f
              );
            int humidity_y2 =
              graph_y + graph_height - lroundf(
                current_humidity * graph_height / 100.0f
              );

            it.line(
              x1,
              temperature_y1,
              x2,
              temperature_y2,
              temperature_color
            );
            it.line(
              x1,
              humidity_y1,
              x2,
              humidity_y2,
              humidity_color
            );
          }
        } else {
          it.print(
            160, 170,
            id(font_small),
            muted,
            TextAlign::CENTER,
            "Waiting for Home Assistant data"
          );
        }

        print_diagnostics();

        return;
      }

      // ============================================================
      // RAIN SCREEN
      // ============================================================

      if (id(active_screen) == 2) {

        const auto rain_color =
          Color(35, 130, 220);

        it.fill(bg);

        it.print(
          12, 4,
          id(font_small),
          muted,
          "Rate / hour"
        );

        if (isnan(id(rain_rate).state)) {
          it.print(
            12, 21,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            12, 21,
            id(font_title),
            rain_color,
            "%.1f mm/h",
            id(rain_rate).state
          );
        }

        it.print(
          164, 4,
          id(font_small),
          muted,
          "Last hour"
        );

        if (isnan(id(rain_last_hour).state)) {
          it.print(
            164, 21,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            164, 21,
            id(font_title),
            rain_color,
            "%.1f mm",
            id(rain_last_hour).state
          );
        }

        it.print(
          12, 47,
          id(font_small),
          muted,
          "Rain 24 h"
        );
        if (isnan(id(rain_24h).state)) {
          it.print(
            12, 64,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            12, 64,
            id(font_title),
            rain_color,
            "%.1f mm",
            id(rain_24h).state
          );
        }

        it.print(
          164, 47,
          id(font_small),
          muted,
          "Rain total"
        );
        if (isnan(id(rain_total).state)) {
          it.print(
            164, 64,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            164, 64,
            id(font_title),
            rain_color,
            "%.1f mm",
            id(rain_total).state
          );
        }

        it.print(
          12, 90,
          id(font_small),
          muted,
          "Cloud base"
        );
        if (isnan(id(cloud_base).state)) {
          it.print(
            12, 107,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            12, 107,
            id(font_title),
            text,
            "%.0f m",
            id(cloud_base).state
          );
        }

        it.print(
          164, 90,
          id(font_small),
          muted,
          "Barometer"
        );
        if (isnan(id(barometer).state)) {
          it.print(
            164, 107,
            id(font_title),
            text,
            "--"
          );
        } else {
          it.printf(
            164, 107,
            id(font_title),
            text,
            "%.0f mbar",
            id(barometer).state
          );
        }

        const int bar_x = 20;
        const int bar_y = 160;
        const int bar_width = 280;
        const int bar_height = 30;

        it.print(
          bar_x,
          bar_y - 25,
          id(font_small),
          muted,
          "Current intensity (0-20 mm/h)"
        );

        it.rectangle(
          bar_x,
          bar_y,
          bar_width,
          bar_height,
          grid
        );

        if (!isnan(id(rain_rate).state)) {
          float rate =
            id(rain_rate).state;

          if (rate < 0.0f)
            rate = 0.0f;
          if (rate > 20.0f)
            rate = 20.0f;

          int filled_width =
            lroundf(rate * bar_width / 20.0f);

          it.filled_rectangle(
            bar_x,
            bar_y,
            filled_width,
            bar_height,
            rain_color
          );
        }

        it.print(
          bar_x,
          bar_y + bar_height + 4,
          id(font_small),
          muted,
          "0"
        );
        it.print(
          bar_x + bar_width,
          bar_y + bar_height + 4,
          id(font_small),
          muted,
          TextAlign::TOP_RIGHT,
          "20"
        );

        print_diagnostics();

        return;
      }

      // ============================================================
      // GEOMETRÍA
      // ============================================================

      const int cx = 160;
      const int cy = 110;
      const int r = 60;

      // ============================================================
      // BEAUFORT
      // ============================================================

      auto beaufort_number = [](float knots) -> int {

        if (knots < 1.0f) return 0;
        if (knots < 4.0f) return 1;
        if (knots < 7.0f) return 2;
        if (knots < 11.0f) return 3;
        if (knots < 17.0f) return 4;
        if (knots < 22.0f) return 5;
        if (knots < 28.0f) return 6;
        if (knots < 34.0f) return 7;
        if (knots < 41.0f) return 8;
        if (knots < 48.0f) return 9;
        if (knots < 56.0f) return 10;
        if (knots < 64.0f) return 11;

        return 12;
      };

      auto beaufort_color = [](int bft) -> Color {

        switch (bft) {

          case 0: return Color(35, 70, 255);
          case 1: return Color(45, 95, 255);
          case 2: return Color(45, 170, 245);
          case 3: return Color(50, 210, 235);
          case 4: return Color(45, 230, 210);
          case 5: return Color(35, 245, 130);
          case 6: return Color(25, 245, 55);
          case 7: return Color(95, 255, 45);
          case 8: return Color(190, 255, 35);
          case 9: return Color(255, 255, 25);
          case 10: return Color(255, 190, 55);
          case 11: return Color(255, 105, 50);

          default:
            return Color(255, 45, 45);
        }
      };

      // ============================================================
      // FONDO
      // ============================================================

      it.fill(bg);

      // ============================================================
      // PERIODO
      // ============================================================

      char start_buf[10] = "--:--:--";
      char end_buf[10] = "--:--:--";
      char sunrise_buf[6] = "--:--";
      char sunset_buf[6] = "--:--";

      uint32_t start_epoch =
        id(first_wind_epoch);

      uint32_t end_epoch =
        id(last_wind_epoch);

      if (start_epoch > 0) {

        time_t start_time =
          start_epoch;

        struct tm *start_tm =
          localtime(&start_time);

        if (start_tm != nullptr) {

          strftime(
            start_buf,
            sizeof(start_buf),
            "%H:%M:%S",
            start_tm
          );
        }
      }

      if (end_epoch > 0) {

        time_t end_time =
          end_epoch;

        struct tm *end_tm =
          localtime(&end_time);

        if (end_tm != nullptr) {

          strftime(
            end_buf,
            sizeof(end_buf),
            "%H:%M:%S",
            end_tm
          );
        }
      }

      const std::string &sunrise_state =
        id(sunrise).state;
      const std::string &sunset_state =
        id(sunset).state;

      if (sunrise_state.size() >= 16 &&
          sunrise_state[10] == 'T') {
        snprintf(
          sunrise_buf,
          sizeof(sunrise_buf),
          "%c%c:%c%c",
          sunrise_state[11],
          sunrise_state[12],
          sunrise_state[14],
          sunrise_state[15]
        );
      }

      if (sunset_state.size() >= 16 &&
          sunset_state[10] == 'T') {
        snprintf(
          sunset_buf,
          sizeof(sunset_buf),
          "%c%c:%c%c",
          sunset_state[11],
          sunset_state[12],
          sunset_state[14],
          sunset_state[15]
        );
      }

      it.printf(
        8, 4,
        id(font_small),
        text,
        "%s-%s     R:%s - S:%s",
        start_buf,
        end_buf,
        sunrise_buf,
        sunset_buf
      );

      // ============================================================
      // DATOS ACTUALES
      // ============================================================

      it.print(
        8, 24,
        id(font_small),
        text,
        "Wind direction"
      );

      it.print(
        214, 24,
        id(font_small),
        text,
        "Wind speed"
      );

      float dir =
        id(last_wind_direction);

      float speed =
        id(last_wind_speed);

      int bft =
        beaufort_number(speed);

      it.printf(
        8, 40,
        id(font_value),
        text,
        "%.1f °",
        dir
      );

      it.printf(
        214, 40,
        id(font_value),
        text,
        "%.2f kt",
        speed
      );

      it.print(
        8, 141,
        id(font_small),
        text,
        "Wind gust"
      );

      if (isnan(id(wind_gust).state)) {
        it.print(
          8, 157,
          id(font_value),
          text,
          "--"
        );
      } else {
        it.printf(
          8, 157,
          id(font_value),
          text,
          "%.2f kt",
          id(wind_gust).state
        );
      }

      it.print(
        220, 141,
        id(font_small),
        text,
        "Cloud base"
      );

      if (isnan(id(cloud_base).state)) {
        it.print(
          220, 157,
          id(font_value),
          text,
          "--"
        );
      } else {
        it.printf(
          210, 157,
          id(font_value),
          text,
          "%.0f m",
          id(cloud_base).state
        );
      }

      // ============================================================
      // ROSA DE LOS VIENTOS
      // ============================================================

      it.circle(
        cx, cy, r,
        grid
      );

      it.circle(
        cx, cy, r * 3 / 4,
        grid
      );

      it.circle(
        cx, cy, r / 2,
        grid
      );

      it.circle(
        cx, cy, r / 4,
        grid
      );

      // ----------------------------------------------------------
      // Líneas radiales
      // ----------------------------------------------------------

      static bool geometry_ready = false;

      static int gx[16];
      static int gy[16];

      if (!geometry_ready) {

        for (int i = 0; i < 16; i++) {

          float angle =
            (i * 22.5f - 90.0f) *
            M_PI / 180.0f;

          gx[i] =
            lroundf(cosf(angle) * r);

          gy[i] =
            lroundf(sinf(angle) * r);
        }

        geometry_ready = true;
      }

      for (int i = 0; i < 16; i++) {

        it.line(
          cx,
          cy,
          cx + gx[i],
          cy + gy[i],
          radial
        );
      }

      // ==========================================================
      // MÁXIMO DE MUESTRAS
      // ==========================================================

      int max_sector_count = 1;

      for (int i = 0; i < 16; i++) {

        if (id(sector_count)[i] >
            max_sector_count)

          max_sector_count =
            id(sector_count)[i];
      }

      // ==========================================================
      // SECTORES HISTÓRICOS
      // ==========================================================

      for (int i = 0; i < 16; i++) {

        int sector_samples =
          id(sector_count)[i];

        if (sector_samples == 0)
          continue;

        float a =
          (i * 22.5f - 90.0f) *
          M_PI / 180.0f;

        float ca = cosf(a);
        float sa = sinf(a);

        int inner = 14;

        int outer =
          22 +
          ((r - 24) *
           sector_samples) /
          max_sector_count;

        int run_start = inner;

        for (int bb = 0; bb <= 12; bb++) {

          int c =
            id(sector_bft_count)[i][bb];

          if (c == 0)
            continue;

          int segment_len =
            ((outer - inner) * c) /
            sector_samples;

          if (segment_len < 2)
            segment_len = 2;

          int run_end =
            run_start + segment_len;

          if (run_end > outer)
            run_end = outer;

          int hx1 =
            cx + lroundf(ca * run_start);

          int hy1 =
            cy + lroundf(sa * run_start);

          int hx2 =
            cx + lroundf(ca * run_end);

          int hy2 =
            cy + lroundf(sa * run_end);

          float nxh = -sa;
          float nyh = ca;

          auto col =
            beaufort_color(bb);

          for (int offset = -2;
               offset <= 2;
               offset++) {

            int ox =
              lroundf(nxh * offset);

            int oy =
              lroundf(nyh * offset);

            it.line(
              hx1 + ox,
              hy1 + oy,
              hx2 + ox,
              hy2 + oy,
              col
            );
          }

          run_start = run_end;

          if (run_start >= outer)
            break;
        }
      }

      // ==========================================================
      // PUNTOS CARDINALES
      // ==========================================================

      it.print(
        cx,
        cy - r - 8,
        id(font_title),
        text,
        TextAlign::CENTER,
        "N"
      );

      it.print(
        cx + r + 10,
        cy,
        id(font_title),
        text,
        TextAlign::CENTER,
        "E"
      );

      it.print(
        cx,
        cy + r + 5,
        id(font_title),
        text,
        TextAlign::CENTER,
        "S"
      );

      it.print(
        cx - r - 10,
        cy,
        id(font_title),
        text,
        TextAlign::CENTER,
        "W"
      );

      // ==========================================================
      // FLECHA DE DIRECCIÓN
      // ==========================================================

      float a =
        (dir - 90.0f) *
        M_PI / 180.0f;

      float ca =
        cosf(a);

      float sa =
        sinf(a);

      float nx =
        -sa;

      float ny =
        ca;

      int tip_x =
        cx + lroundf(ca * (r + 3));

      int tip_y =
        cy + lroundf(sa * (r + 3));

      int base_x =
        cx + lroundf(ca * (r + 17));

      int base_y =
        cy + lroundf(sa * (r + 17));

      int left_x =
        base_x + lroundf(nx * 7);

      int left_y =
        base_y + lroundf(ny * 7);

      int right_x =
        base_x - lroundf(nx * 7);

      int right_y =
        base_y - lroundf(ny * 7);

      for (float t = -1.0f;
           t <= 1.0f;
           t += 0.25f) {

        int bx =
          base_x +
          lroundf(nx * 7 * t);

        int by =
          base_y +
          lroundf(ny * 7 * t);

        it.line(
          tip_x,
          tip_y,
          bx,
          by,
          red
        );
      }

      it.line(
        left_x,
        left_y,
        right_x,
        right_y,
        red
      );

      // ==========================================================
      // CALMA
      // ==========================================================

      int center_pct =
        id(sample_count) > 0
          ? (id(calm_count) * 100) /
            id(sample_count)
          : 0;

      it.filled_circle(
        cx,
        cy,
        13,
        blue
      );

      it.printf(
        cx,
        cy,
        id(font_small),
        bg,
        TextAlign::CENTER,
        "%d",
        center_pct
      );

      // ==========================================================
      // ESCALA BEAUFORT
      // ==========================================================

      const int bar_x = 10;
      const int bar_y = 200;
      const int bar_w = 300;
      const int band_w = bar_w / 13;
      const int band_h = 22;

      for (int bb = 0; bb <= 12; bb++) {

        int x =
          bar_x + bb * band_w;

        it.filled_rectangle(
          x,
          bar_y,
          band_w,
          band_h,
          beaufort_color(bb)
        );

        it.rectangle(
          x,
          bar_y,
          band_w,
          band_h,
          Color(190, 190, 190)
        );

        it.printf(
          x + band_w / 2,
          bar_y,
          id(font_small),
          text,
          TextAlign::TOP_CENTER,
          "%d",
          bb
        );
      }

      // ============================================================
      // MARCADOR BEAUFORT
      // ============================================================

      int marker_x =
        bar_x + bft * band_w + band_w / 2;

      for (int i = 0; i < 8; i++) {

        it.line(
          marker_x - 6 + i,
          bar_y - 8,
          marker_x,
          bar_y - 1,
          red
        );

        it.line(
          marker_x + 6 - i,
          bar_y - 8,
          marker_x,
          bar_y - 1,
          red
        );
      }

      // ============================================================
      // DIAGNÓSTICO INFERIOR
      // ============================================================

      print_diagnostics();
