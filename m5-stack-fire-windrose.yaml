substitutions:
  wind_direction_entity: sensor.estacion_direccion_del_viento
  wind_speed_entity: sensor.estacion_velocidad_del_viento
  wind_sample_capacity: "212"

esphome:
  name: m5-stack-fire
  friendly_name: M5Stack Fire
  area: Estudio

esp32:
  board: m5stack-fire
  framework:
    type: esp-idf
    advanced:
      minimum_chip_revision: "3.0"
      sram1_as_iram: true
  cpu_frequency: 240MHZ
  variant: ESP32
  flash_mode: qio
  flash_frequency: 80MHZ
  flash_size: 16MB

# -------------------------------------------------------------------
# PSRAM
#
# El M5Stack Fire dispone de PSRAM.
# La usamos para el framebuffer completo del display.
# -------------------------------------------------------------------

psram:
  mode: quad
  speed: 80MHz

logger:
  level: WARN

# -------------------------------------------------------------------
# HOME ASSISTANT API
# -------------------------------------------------------------------

api:
  encryption:
    key: !secret m5_stack_fire__encryption_key

  on_client_connected:
    then:
      - lambda: |-
          id(ha_api_connected) = true;

  on_client_disconnected:
    then:
      - lambda: |-
          id(ha_api_connected) = false;
          id(ha_api_disconnects)++;

ota:
  - platform: esphome

  - platform: http_request
    id: ota_http_request_1

  - platform: web_server

web_server:
  version: 3
  include_internal: true

# -------------------------------------------------------------------
# WIFI
# -------------------------------------------------------------------

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_btm: true

# -------------------------------------------------------------------
# GLOBALS
# -------------------------------------------------------------------

globals:

  - id: ha_api_connected
    type: bool
    restore_value: false
    initial_value: "false"

  - id: ha_api_disconnects
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---------------------------------------------------------------
  # ÚLTIMOS DATOS VÁLIDOS
  # ---------------------------------------------------------------

  - id: last_wind_direction
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: last_wind_speed
    type: float
    restore_value: false
    initial_value: "0.0"

  - id: have_wind_data
    type: bool
    restore_value: false
    initial_value: "false"

  # ---------------------------------------------------------------
  # INSTANTE DE RECEPCIÓN DEL ÚLTIMO DATO DE VIENTO
  #
  # Se actualiza directamente cuando llega el dato desde HA.
  # No depende del intervalo de adquisición de 17 s.
  # ---------------------------------------------------------------

  - id: last_wind_epoch
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # ---------------------------------------------------------------
  # HISTÓRICO
  # ---------------------------------------------------------------

  - id: sample_count
    type: int
    restore_value: false
    initial_value: "0"

  - id: sample_pos
    type: int
    restore_value: false
    initial_value: "0"

  - id: sample_sector
    type: uint8_t[${wind_sample_capacity}]
    restore_value: false

  - id: sample_bft
    type: uint8_t[${wind_sample_capacity}]
    restore_value: false

  - id: sample_ts
    type: uint32_t[${wind_sample_capacity}]
    restore_value: false

  - id: sector_count
    type: uint16_t[16]
    restore_value: false

  - id: sector_bft_count
    type: uint16_t[16][13]
    restore_value: false

  - id: calm_count
    type: uint16_t
    restore_value: false
    initial_value: "0"

# -------------------------------------------------------------------
# HOME ASSISTANT SENSORS
# -------------------------------------------------------------------

sensor:

  # ---------------------------------------------------------------
  # DIRECCIÓN DEL VIENTO
  #
  # Actualiza inmediatamente el valor mostrado.
  # ---------------------------------------------------------------

  - platform: homeassistant
    id: wind_direction
    entity_id: ${wind_direction_entity}
    internal: true

    on_value:
      then:
        - lambda: |-

            if (isnan(x))
              return;

            float dir = x;

            while (dir < 0.0f)
              dir += 360.0f;

            while (dir >= 360.0f)
              dir -= 360.0f;

            id(last_wind_direction) = dir;
            id(have_wind_data) = true;

  # ---------------------------------------------------------------
  # VELOCIDAD DEL VIENTO
  #
  # Los dos sensores llegan juntos.
  #
  # Este callback:
  #   1. Actualiza la velocidad.
  #   2. Guarda el instante de recepción.
  #   3. Redibuja inmediatamente la pantalla.
  # ---------------------------------------------------------------

  - platform: homeassistant
    id: wind_speed
    entity_id: ${wind_speed_entity}
    internal: true

    on_value:
      then:
        - lambda: |-

            if (isnan(x))
              return;

            id(last_wind_speed) = x;
            id(have_wind_data) = true;

            auto current_time =
              id(ha_time).now();

            if (current_time.is_valid())
              id(last_wind_epoch) =
                current_time.timestamp;

        - component.update: m5_display

  - platform: wifi_signal
    id: wifi_db
    internal: true
    update_interval: 60s

  - platform: uptime
    id: uptime_sensor
    internal: true
    update_interval: 60s

# -------------------------------------------------------------------
# TIME
# -------------------------------------------------------------------

time:

  - platform: homeassistant
    id: ha_time

# -------------------------------------------------------------------
# ADQUISICIÓN DE DATOS
# -------------------------------------------------------------------

interval:

  - interval: 17s
    then:
      - lambda: |-

          if (!id(ha_api_connected))
            return;

          if (isnan(id(wind_direction).state) ||
              isnan(id(wind_speed).state))
            return;

          // ---------------------------------------------------------
          // Dirección
          // ---------------------------------------------------------

          float dir = id(wind_direction).state;

          while (dir < 0.0f)
            dir += 360.0f;

          while (dir >= 360.0f)
            dir -= 360.0f;

          float knots = id(wind_speed).state;

          // ---------------------------------------------------------
          // Última lectura válida
          // ---------------------------------------------------------

          id(last_wind_direction) = dir;
          id(last_wind_speed) = knots;
          id(have_wind_data) = true;

          // ---------------------------------------------------------
          // Beaufort
          // ---------------------------------------------------------

          int bft = 0;

          if (knots < 1.0f) bft = 0;
          else if (knots < 4.0f) bft = 1;
          else if (knots < 7.0f) bft = 2;
          else if (knots < 11.0f) bft = 3;
          else if (knots < 17.0f) bft = 4;
          else if (knots < 22.0f) bft = 5;
          else if (knots < 28.0f) bft = 6;
          else if (knots < 34.0f) bft = 7;
          else if (knots < 41.0f) bft = 8;
          else if (knots < 48.0f) bft = 9;
          else if (knots < 56.0f) bft = 10;
          else if (knots < 64.0f) bft = 11;
          else bft = 12;

          // ---------------------------------------------------------
          // Sector de 22.5 grados
          // ---------------------------------------------------------

          int sector =
            int((dir + 11.25f) / 22.5f) % 16;

          // ---------------------------------------------------------
          // Timestamp
          // ---------------------------------------------------------

          auto current_time = id(ha_time).now();

          uint32_t epoch = 0;

          if (current_time.is_valid())
            epoch = current_time.timestamp;

          // ---------------------------------------------------------
          // Buffer circular
          // ---------------------------------------------------------

          int pos = id(sample_pos);

          if (id(sample_count) >= ${wind_sample_capacity}) {

            int old_sector =
              id(sample_sector)[pos];

            int old_bft =
              id(sample_bft)[pos];

            if (id(sector_count)[old_sector] > 0)
              id(sector_count)[old_sector]--;

            if (id(sector_bft_count)[old_sector][old_bft] > 0)
              id(sector_bft_count)[old_sector][old_bft]--;

            if (old_bft == 0 &&
                id(calm_count) > 0)
              id(calm_count)--;

          } else {

            id(sample_count)++;
          }

          // ---------------------------------------------------------
          // Guardar muestra
          // ---------------------------------------------------------

          id(sample_sector)[pos] = sector;
          id(sample_bft)[pos] = bft;
          id(sample_ts)[pos] = epoch;

          // ---------------------------------------------------------
          // Contadores
          // ---------------------------------------------------------

          id(sector_count)[sector]++;
          id(sector_bft_count)[sector][bft]++;

          if (bft == 0)
            id(calm_count)++;

          // ---------------------------------------------------------
          // Siguiente posición
          // ---------------------------------------------------------

          id(sample_pos) =
            (pos + 1) % ${wind_sample_capacity};

# -------------------------------------------------------------------
# BACKLIGHT
# -------------------------------------------------------------------

binary_sensor:

  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: GPIO39
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 35%

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: GPIO38
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 70%

  - platform: gpio
    id: button_c
    name: "Button C"
    pin:
      number: GPIO37
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 100%

output:

  - platform: ledc
    pin: GPIO32
    id: backlight

light:

  - platform: monochromatic
    id: display_backlight
    internal: true
    output: backlight
    restore_mode: ALWAYS_ON

# -------------------------------------------------------------------
# SPI
# -------------------------------------------------------------------

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23

# -------------------------------------------------------------------
# FUENTES
# -------------------------------------------------------------------

font:

  - file:
      type: gfonts
      family: Open+Sans
      weight: 600
    id: font_title
    size: 20
    bpp: 4

  - file:
      type: gfonts
      family: Open+Sans
      weight: 600
    id: font_value
    size: 28
    bpp: 4

  - file:
      type: gfonts
      family: Open+Sans
      weight: 600
    id: font_small
    size: 16
    bpp: 4

# -------------------------------------------------------------------
# DISPLAY
# -------------------------------------------------------------------

display:

  - platform: mipi_spi
    id: m5_display
    model: M5CORE

    cs_pin: GPIO14
    dc_pin: GPIO27
    reset_pin: GPIO33

    data_rate: 40MHz

    invert_colors: true

    auto_clear_enabled: true

    buffer_size: 100%

    # ---------------------------------------------------------------
    # La pantalla NO se actualiza periódicamente.
    #
    # Se actualiza exclusivamente mediante:
    #
    #   component.update: m5_display
    #
    # cuando llega un nuevo dato de viento desde Home Assistant.
    # ---------------------------------------------------------------

    update_interval: never

    use_axis_flips: false

    lambda: |-

      // ============================================================
      // COLORES
      // ============================================================

      const auto bg =
        Color(255, 255, 255);

      const auto text =
        Color(20, 20, 20);

      const auto grid =
        Color(205, 205, 205);

      const auto radial =
        Color(228, 228, 228);

      const auto muted =
        Color(95, 95, 95);

      const auto blue =
        Color(45, 65, 220);

      const auto red =
        Color(255, 0, 0);

      // ============================================================
      // GEOMETRÍA
      // ============================================================

      const int cx = 142;
      const int cy = 128;
      const int r = 58;

      // ============================================================
      // BEAUFORT
      // ============================================================

      auto beaufort_number = [](float knots) -> int {

        if (knots < 1.0f) return 0;
        if (knots < 4.0f) return 1;
        if (knots < 7.0f) return 2;
        if (knots < 11.0f) return 3;
        if (knots < 17.0f) return 4;
        if (knots < 22.0f) return 5;
        if (knots < 28.0f) return 6;
        if (knots < 34.0f) return 7;
        if (knots < 41.0f) return 8;
        if (knots < 48.0f) return 9;
        if (knots < 56.0f) return 10;
        if (knots < 64.0f) return 11;

        return 12;
      };

      auto beaufort_color = [](int bft) -> Color {

        switch (bft) {

          case 0: return Color(35, 70, 255);
          case 1: return Color(45, 95, 255);
          case 2: return Color(45, 170, 245);
          case 3: return Color(50, 210, 235);
          case 4: return Color(45, 230, 210);
          case 5: return Color(35, 245, 130);
          case 6: return Color(25, 245, 55);
          case 7: return Color(95, 255, 45);
          case 8: return Color(190, 255, 35);
          case 9: return Color(255, 255, 25);
          case 10: return Color(255, 190, 55);
          case 11: return Color(255, 105, 50);

          default:
            return Color(255, 45, 45);
        }
      };

      // ============================================================
      // FONDO
      // ============================================================

      it.fill(bg);

      // ============================================================
      // TÍTULO
      // ============================================================

      it.print(
        160, 4,
        id(font_title),
        text,
        TextAlign::TOP_CENTER,
        "Wind Vane"
      );

      // ============================================================
      // PERIODO
      // ============================================================

      char start_buf[10] = "--:--:--";
      char end_buf[10] = "--:--:--";

      uint32_t start_epoch = 0;

      int count = id(sample_count);

      if (count > 0) {

        int oldest_index;

        if (count < ${wind_sample_capacity})
          oldest_index = 0;
        else
          oldest_index = id(sample_pos);

        start_epoch =
          id(sample_ts)[oldest_index];

        if (start_epoch == 0) {

          for (int i = 0; i < count; i++) {

            int idx =
              (oldest_index + i) %
              ${wind_sample_capacity};

            if (id(sample_ts)[idx] > 0) {

              start_epoch =
                id(sample_ts)[idx];

              break;
            }
          }
        }

        // ----------------------------------------------------------
        // La hora final YA NO se obtiene del histórico.
        //
        // Se obtiene directamente del último dato recibido
        // desde Home Assistant.
        // ----------------------------------------------------------

        uint32_t end_epoch =
          id(last_wind_epoch);

        if (start_epoch > 0) {

          time_t start_time =
            start_epoch;

          struct tm *start_tm =
            localtime(&start_time);

          if (start_tm != nullptr) {

            strftime(
              start_buf,
              sizeof(start_buf),
              "%H:%M:%S",
              start_tm
            );
          }
        }

        if (end_epoch > 0) {

          time_t end_time =
            end_epoch;

          struct tm *end_tm =
            localtime(&end_time);

          if (end_tm != nullptr) {

            strftime(
              end_buf,
              sizeof(end_buf),
              "%H:%M:%S",
              end_tm
            );
          }
        }
      }

      it.print(
        8, 26,
        id(font_small),
        text,
        "Period:"
      );

      it.printf(
        65, 26,
        id(font_small),
        text,
        "%s - %s",
        start_buf,
        end_buf
      );

      // ============================================================
      // DATOS ACTUALES
      // ============================================================

      it.print(
        8, 49,
        id(font_small),
        text,
        "Wind direction"
      );

      it.print(
        198, 49,
        id(font_small),
        text,
        "Wind speed"
      );

      float dir =
        id(last_wind_direction);

      float speed =
        id(last_wind_speed);

      int bft =
        beaufort_number(speed);

      it.printf(
        8, 63,
        id(font_value),
        text,
        "%.1f °",
        dir
      );

      it.printf(
        198, 63,
        id(font_value),
        text,
        "%.2f kt",
        speed
      );

      // ==========================================================
      // ROSA DE LOS VIENTOS
      // ==========================================================

      it.circle(
        cx, cy, r,
        grid
      );

      it.circle(
        cx, cy, r * 3 / 4,
        grid
      );

      it.circle(
        cx, cy, r / 2,
        grid
      );

      it.circle(
        cx, cy, r / 4,
        grid
      );

      // ----------------------------------------------------------
      // Líneas radiales
      // ----------------------------------------------------------

      static bool geometry_ready = false;

      static int gx[16];
      static int gy[16];

      if (!geometry_ready) {

        for (int i = 0; i < 16; i++) {

          float angle =
            (i * 22.5f - 90.0f) *
            M_PI / 180.0f;

          gx[i] =
            lroundf(cosf(angle) * r);

          gy[i] =
            lroundf(sinf(angle) * r);
        }

        geometry_ready = true;
      }

      for (int i = 0; i < 16; i++) {

        it.line(
          cx,
          cy,
          cx + gx[i],
          cy + gy[i],
          radial
        );
      }

      // ==========================================================
      // MÁXIMO DE MUESTRAS
      // ==========================================================

      int max_sector_count = 1;

      for (int i = 0; i < 16; i++) {

        if (id(sector_count)[i] >
            max_sector_count)

          max_sector_count =
            id(sector_count)[i];
      }

      // ==========================================================
      // SECTORES HISTÓRICOS
      // ==========================================================

      for (int i = 0; i < 16; i++) {

        int sector_samples =
          id(sector_count)[i];

        if (sector_samples == 0)
          continue;

        float a =
          (i * 22.5f - 90.0f) *
          M_PI / 180.0f;

        float ca = cosf(a);
        float sa = sinf(a);

        int inner = 14;

        int outer =
          22 +
          ((r - 24) *
           sector_samples) /
          max_sector_count;

        int run_start = inner;

        for (int bb = 0; bb <= 12; bb++) {

          int c =
            id(sector_bft_count)[i][bb];

          if (c == 0)
            continue;

          int segment_len =
            ((outer - inner) * c) /
            sector_samples;

          if (segment_len < 2)
            segment_len = 2;

          int run_end =
            run_start + segment_len;

          if (run_end > outer)
            run_end = outer;

          int hx1 =
            cx + lroundf(ca * run_start);

          int hy1 =
            cy + lroundf(sa * run_start);

          int hx2 =
            cx + lroundf(ca * run_end);

          int hy2 =
            cy + lroundf(sa * run_end);

          float nxh = -sa;
          float nyh = ca;

          auto col =
            beaufort_color(bb);

          for (int offset = -2;
               offset <= 2;
               offset++) {

            int ox =
              lroundf(nxh * offset);

            int oy =
              lroundf(nyh * offset);

            it.line(
              hx1 + ox,
              hy1 + oy,
              hx2 + ox,
              hy2 + oy,
              col
            );
          }

          run_start = run_end;

          if (run_start >= outer)
            break;
        }
      }

      // ==========================================================
      // PUNTOS CARDINALES
      // ==========================================================

      it.print(
        cx,
        cy - r - 8,
        id(font_title),
        text,
        TextAlign::CENTER,
        "N"
      );

      it.print(
        cx + r + 10,
        cy,
        id(font_title),
        text,
        TextAlign::CENTER,
        "E"
      );

      it.print(
        cx,
        cy + r + 5,
        id(font_title),
        text,
        TextAlign::CENTER,
        "S"
      );

      it.print(
        cx - r - 10,
        cy,
        id(font_title),
        text,
        TextAlign::CENTER,
        "W"
      );

      // ==========================================================
      // FLECHA DE DIRECCIÓN
      // ==========================================================

      float a =
        (dir - 90.0f) *
        M_PI / 180.0f;

      float ca =
        cosf(a);

      float sa =
        sinf(a);

      float nx =
        -sa;

      float ny =
        ca;

      int tip_x =
        cx + lroundf(ca * (r + 3));

      int tip_y =
        cy + lroundf(sa * (r + 3));

      int base_x =
        cx + lroundf(ca * (r + 17));

      int base_y =
        cy + lroundf(sa * (r + 17));

      int left_x =
        base_x + lroundf(nx * 7);

      int left_y =
        base_y + lroundf(ny * 7);

      int right_x =
        base_x - lroundf(nx * 7);

      int right_y =
        base_y - lroundf(ny * 7);

      for (float t = -1.0f;
           t <= 1.0f;
           t += 0.25f) {

        int bx =
          base_x +
          lroundf(nx * 7 * t);

        int by =
          base_y +
          lroundf(ny * 7 * t);

        it.line(
          tip_x,
          tip_y,
          bx,
          by,
          red
        );
      }

      it.line(
        left_x,
        left_y,
        right_x,
        right_y,
        red
      );

      // ==========================================================
      // CALMA
      // ==========================================================

      int center_pct =
        id(sample_count) > 0
          ? (id(calm_count) * 100) /
            id(sample_count)
          : 0;

      it.filled_circle(
        cx,
        cy,
        13,
        blue
      );

      it.printf(
        cx,
        cy,
        id(font_small),
        bg,
        TextAlign::CENTER,
        "%d%%",
        center_pct
      );

      // ==========================================================
      // ESCALA BEAUFORT
      // ==========================================================

      const int bar_x = 287;
      const int bar_y = 96;
      const int bar_w = 20;
      const int band_h = 9;

      it.print(
        bar_x - 9,
        84,
        id(font_small),
        text,
        "Beaufort"
      );

      for (int bb = 12;
           bb >= 0;
           bb--) {

        int y =
          bar_y +
          (12 - bb) * band_h;

        it.filled_rectangle(
          bar_x,
          y,
          bar_w,
          band_h,
          beaufort_color(bb)
        );

        it.rectangle(
          bar_x,
          y,
          bar_w,
          band_h,
          Color(190, 190, 190)
        );

        it.printf(
          bar_x + bar_w + 4,
          y - 1,
          id(font_small),
          text,
          "%d",
          bb
        );
      }

      // ==========================================================
      // MARCADOR BEAUFORT
      // ==========================================================

      int marker_y =
        bar_y +
        (12 - bft) * band_h +
        band_h / 2;

      for (int i = 0; i < 8; i++) {

        it.line(
          bar_x - 10,
          marker_y - 5 + i,
          bar_x - 1,
          marker_y,
          red
        );

        it.line(
          bar_x - 10,
          marker_y + 5 - i,
          bar_x - 1,
          marker_y,
          red
        );
      }

      // ============================================================
      // DIAGNÓSTICO INFERIOR
      // ============================================================

      it.printf(
        8,
        216,
        id(font_small),
        muted,
        "WiFi %.0f dBm",
        id(wifi_db).state
      );

      it.printf(
        122,
        216,
        id(font_small),
        muted,
        "Disc: %u",
        id(ha_api_disconnects)
      );

      it.printf(
        205,
        216,
        id(font_small),
        muted,
        "Up: %.0fs",
        id(uptime_sensor).state
      );

# -------------------------------------------------------------------
# RUNTIME STATS
# -------------------------------------------------------------------

runtime_stats:
  log_interval: 60s

http_request: