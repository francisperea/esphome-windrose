substitutions:
  wind_direction_entity: sensor.estacion_direccion_del_viento
  wind_speed_entity: sensor.estacion_velocidad_del_viento

esphome:
  name: m5-stack-fire
  friendly_name: M5Stack Fire

esp32:
  board: m5stack-fire
  framework:
    type: arduino

psram:

logger:

api:
  encryption:
    key: !secret m5_stack_fire_encryption_key
  on_client_connected:
    then:
      - lambda: |-
          id(ha_api_connected) = true;
      - component.update: m5_display
  on_client_disconnected:
    then:
      - lambda: |-
          id(ha_api_connected) = false;
      - component.update: m5_display

globals:
  - id: ha_api_connected
    type: bool
    restore_value: false
    initial_value: "false"

ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "M5Stack Fire Fallback"
    password: "12345678"

captive_portal:

web_server:
  port: 80

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19

output:
  - platform: ledc
    pin: GPIO32
    id: backlight

light:
  - platform: monochromatic
    id: display_backlight
    name: "Display Backlight"
    output: backlight
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 18
  - file: "gfonts://Roboto"
    id: font_value
    size: 24
  - file: "gfonts://Roboto"
    id: font_small
    size: 12

binary_sensor:
  - platform: gpio
    id: button_a
    name: "Button A"
    pin:
      number: GPIO39
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 35%

  - platform: gpio
    id: button_b
    name: "Button B"
    pin:
      number: GPIO38
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 70%

  - platform: gpio
    id: button_c
    name: "Button C"
    pin:
      number: GPIO37
      inverted: true
    on_press:
      then:
        - light.turn_on:
            id: display_backlight
            brightness: 100%

sensor:
  - platform: homeassistant
    id: wind_direction
    entity_id: ${wind_direction_entity}
    internal: true

  - platform: homeassistant
    id: wind_speed
    entity_id: ${wind_speed_entity}
    internal: true

  - platform: wifi_signal
    id: wifi_db
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: uptime_sensor
    name: "Uptime"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
    ssid:
      name: "Connected SSID"

time:
  - platform: homeassistant
    id: ha_time

display:
  - platform: ili9xxx
    id: m5_display
    model: M5STACK
    cs_pin: GPIO14
    dc_pin: GPIO27
    reset_pin: GPIO33
    data_rate: 20MHz
    invert_colors: true
    update_interval: 17s
    lambda: |-
      const int cx = 142;
      const int cy = 144;
      const int r = 62;
      const auto bg = Color(255, 255, 255);
      const auto text = Color(20, 20, 20);
      const auto grid = Color(205, 205, 205);
      const auto muted = Color(95, 95, 95);
      const auto blue = Color(45, 65, 220);
      const auto red = Color(255, 0, 0);

      auto beaufort_number = [](float knots) -> int {
        if (knots < 1.0f) return 0;
        if (knots < 4.0f) return 1;
        if (knots < 7.0f) return 2;
        if (knots < 11.0f) return 3;
        if (knots < 17.0f) return 4;
        if (knots < 22.0f) return 5;
        if (knots < 28.0f) return 6;
        if (knots < 34.0f) return 7;
        if (knots < 41.0f) return 8;
        if (knots < 48.0f) return 9;
        if (knots < 56.0f) return 10;
        if (knots < 64.0f) return 11;
        return 12;
      };

      auto beaufort_color = [](int bft) -> Color {
        switch (bft) {
          case 0: return Color(35, 70, 255);
          case 1: return Color(45, 95, 255);
          case 2: return Color(45, 170, 245);
          case 3: return Color(50, 210, 235);
          case 4: return Color(45, 230, 210);
          case 5: return Color(35, 245, 130);
          case 6: return Color(25, 245, 55);
          case 7: return Color(95, 255, 45);
          case 8: return Color(190, 255, 35);
          case 9: return Color(255, 255, 25);
          case 10: return Color(255, 190, 55);
          case 11: return Color(255, 105, 50);
          default: return Color(255, 45, 45);
        }
      };

      it.fill(bg);
      it.print(160, 4, id(font_title), text, TextAlign::TOP_CENTER, "Wind Vane");
      it.print(8, 27, id(font_small), text, "Period:");

      if (!id(ha_api_connected)) {
        it.print(160, 96, id(font_title), muted, TextAlign::CENTER, "Waiting for HA API");
        it.print(160, 122, id(font_small), muted, TextAlign::CENTER, "Add this ESPHome device");
        it.print(160, 140, id(font_small), muted, TextAlign::CENTER, "in Home Assistant");
        return;
      }

      if (isnan(id(wind_direction).state) || isnan(id(wind_speed).state)) {
        it.print(160, 112, id(font_title), muted, TextAlign::CENTER, "Waiting for HA sensors");
        it.print(160, 136, id(font_small), muted, TextAlign::CENTER, "${wind_direction_entity}");
        it.print(160, 152, id(font_small), muted, TextAlign::CENTER, "${wind_speed_entity}");
        return;
      }

      float dir = id(wind_direction).state;
      float speed = id(wind_speed).state;
      while (dir < 0) dir += 360.0;
      while (dir >= 360.0) dir -= 360.0;
      int bft = beaufort_number(speed);
      static const int sample_cap = 5088;
      static uint8_t sample_sector[sample_cap] = {0};
      static uint8_t sample_bft[sample_cap] = {0};
      static uint32_t sample_ts[sample_cap] = {0};
      static int sample_pos = 0;
      static int sample_count = 0;
      static uint32_t last_sample_ms = 0;
      uint32_t now_ms = millis();
      auto current_time = id(ha_time).now();
      uint32_t now_epoch = current_time.is_valid() ? current_time.timestamp : 0;

      if (last_sample_ms == 0 || now_ms - last_sample_ms >= 16000) {
        int sector = int((dir + 11.25f) / 22.5f) % 16;
        sample_sector[sample_pos] = sector;
        sample_bft[sample_pos] = bft;
        sample_ts[sample_pos] = now_epoch;
        sample_pos = (sample_pos + 1) % sample_cap;
        if (sample_count < sample_cap) sample_count++;
        last_sample_ms = now_ms;
      }

      char start_buf[10] = "--:--:--";
      char end_buf[10] = "--:--:--";
      if (sample_count > 0 && now_epoch > 0) {
        int oldest_index = sample_count < sample_cap ? 0 : sample_pos;
        uint32_t start_epoch = sample_ts[oldest_index];
        if (start_epoch == 0) {
          for (int i = 0; i < sample_count; i++) {
            int idx = sample_count < sample_cap ? i : (sample_pos + i) % sample_cap;
            if (sample_ts[idx] > 0) {
              start_epoch = sample_ts[idx];
              break;
            }
          }
        }
        if (start_epoch > 0) {
          time_t start_time = start_epoch;
          struct tm *start_tm = localtime(&start_time);
          strftime(start_buf, sizeof(start_buf), "%H:%M:%S", start_tm);
        }
        time_t end_time = now_epoch;
        struct tm *end_tm = localtime(&end_time);
        strftime(end_buf, sizeof(end_buf), "%H:%M:%S", end_tm);
      }
      it.printf(62, 27, id(font_small), text, "%s - %s", start_buf, end_buf);

      it.print(8, 49, id(font_small), text, "Wind direction");
      it.printf(8, 63, id(font_value), text, "%.1f °", dir);
      it.print(198, 49, id(font_small), text, "Wind speed");
      it.printf(198, 63, id(font_value), text, "%.2f kt", speed);

      it.circle(cx, cy, r, grid);
      it.circle(cx, cy, r * 3 / 4, grid);
      it.circle(cx, cy, r / 2, grid);
      it.circle(cx, cy, r / 4, grid);

      for (int i = 0; i < 16; i++) {
        float a = (i * 22.5f - 90.0f) * M_PI / 180.0f;
        int x = cx + cosf(a) * r;
        int y = cy + sinf(a) * r;
        it.line(cx, cy, x, y, Color(228, 228, 228));
      }

      int sector_count[16] = {0};
      int sector_bft_count[16][13] = {0};
      int max_sector_count = 1;
      int calm_count = 0;
      for (int i = 0; i < sample_count; i++) {
        int s = sample_sector[i];
        int sb = sample_bft[i];
        sector_count[s]++;
        sector_bft_count[s][sb]++;
        if (sb == 0) calm_count++;
        if (sector_count[s] > max_sector_count) max_sector_count = sector_count[s];
      }

      for (int i = 0; i < 16; i++) {
        if (sector_count[i] == 0) continue;
        float a = (i * 22.5f - 90.0f) * M_PI / 180.0f;
        int inner = 14;
        int outer = 22 + ((r - 24) * sector_count[i]) / max_sector_count;
        int run_start = inner;
        for (int bb = 0; bb <= 12; bb++) {
          int c = sector_bft_count[i][bb];
          if (c == 0) continue;
          int segment_len = ((outer - inner) * c) / sector_count[i];
          if (segment_len < 2) segment_len = 2;
          int run_end = run_start + segment_len;
          if (run_end > outer) run_end = outer;
          int hx1 = cx + cosf(a) * run_start;
          int hy1 = cy + sinf(a) * run_start;
          int hx2 = cx + cosf(a) * run_end;
          int hy2 = cy + sinf(a) * run_end;
          float nxh = -sinf(a);
          float nyh = cosf(a);
          auto col = beaufort_color(bb);
          for (int offset = -3; offset <= 3; offset++) {
            int ox = lroundf(nxh * offset);
            int oy = lroundf(nyh * offset);
            it.line(hx1 + ox, hy1 + oy, hx2 + ox, hy2 + oy, col);
          }
          run_start = run_end;
          if (run_start >= outer) break;
        }
      }

      it.print(cx, cy - r - 13, id(font_title), text, TextAlign::CENTER, "N");
      it.print(cx + r + 14, cy, id(font_title), text, TextAlign::CENTER, "E");
      it.print(cx, cy + r + 13, id(font_title), text, TextAlign::CENTER, "S");
      it.print(cx - r - 14, cy, id(font_title), text, TextAlign::CENTER, "W");

      float a = (dir - 90.0f) * M_PI / 180.0f;
      int tip_x = cx + cosf(a) * (r + 3);
      int tip_y = cy + sinf(a) * (r + 3);
      int base_x = cx + cosf(a) * (r + 17);
      int base_y = cy + sinf(a) * (r + 17);
      float nx = -sinf(a);
      float ny = cosf(a);
      int left_x = base_x + nx * 7;
      int left_y = base_y + ny * 7;
      int right_x = base_x - nx * 7;
      int right_y = base_y - ny * 7;
      for (float t = -1.0f; t <= 1.0f; t += 0.25f) {
        int bx = base_x + nx * 7 * t;
        int by = base_y + ny * 7 * t;
        it.line(tip_x, tip_y, bx, by, red);
      }
      it.line(left_x, left_y, right_x, right_y, red);

      int center_pct = sample_count > 0 ? (calm_count * 100) / sample_count : 0;
      it.filled_circle(cx, cy, 13, blue);
      it.printf(cx, cy, id(font_small), bg, TextAlign::CENTER, "%d%%", center_pct);

      const int bar_x = 287;
      const int bar_y = 96;
      const int bar_w = 20;
      const int band_h = 9;
      it.print(bar_x - 9, 84, id(font_small), text, "Beaufort");
      for (int bb = 12; bb >= 0; bb--) {
        int y = bar_y + (12 - bb) * band_h;
        it.filled_rectangle(bar_x, y, bar_w, band_h, beaufort_color(bb));
        it.rectangle(bar_x, y, bar_w, band_h, Color(190, 190, 190));
        it.printf(bar_x + bar_w + 4, y - 1, id(font_small), text, "%d", bb);
      }

      int marker_y = bar_y + (12 - bft) * band_h + band_h / 2;
      for (int i = 0; i < 8; i++) {
        it.line(bar_x - 10, marker_y - 5 + i, bar_x - 1, marker_y, red);
        it.line(bar_x - 10, marker_y + 5 - i, bar_x - 1, marker_y, red);
      }
